; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the wand firmware; the native env below is only for tests.
default_envs = esp32dev

[env:esp32dev]
; Pinned to the installed version (Arduino-ESP32 core 2.0.17) so library APIs
; don't change underneath us when PlatformIO updates.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino

; The Bluetooth stack alone fills most of the default 1.3 MB app space. We don't use
; over-the-air updates, so take the built-in 3 MB single-app layout instead.
board_build.partitions = huge_app.csv

monitor_speed = 115200
; Decodes crash backtraces into file:line in the serial monitor.
monitor_filters = esp32_exception_decoder

; BNO086 driver (wraps CEVA's official SH-2 sensor hub code). Pinned for reproducible builds.
lib_deps = sparkfun/SparkFun BNO08x Cortex Based IMU@1.0.6
; The logic tests run on this computer (env:native), not on the ESP32.
test_ignore = test_wand_core

; Runs the hardware-independent logic in lib/wand_core on this computer:
;   ~/.platformio/penv/bin/pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra
