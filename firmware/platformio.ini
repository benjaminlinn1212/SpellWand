; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Pinned to the installed version (Arduino-ESP32 core 2.0.17) so library APIs
; don't change underneath us when PlatformIO updates.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino

monitor_speed = 115200
; Decodes crash backtraces into file:line in the serial monitor.
monitor_filters = esp32_exception_decoder

; BNO086 driver (wraps CEVA's official SH-2 sensor hub code). Pinned for reproducible builds.
lib_deps = sparkfun/SparkFun BNO08x Cortex Based IMU@1.0.6
