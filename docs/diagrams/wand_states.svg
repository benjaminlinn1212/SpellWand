<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>SpellWand wand states</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="arrow-tomac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="arrow-towand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4fd6"/></marker><marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6070"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="700" text-anchor="start" fill="#1f2430">SpellWand: wand states</text>
<text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#5b6070">firmware/lib/wand_core/wand_state.cpp. LED feedback is separate from the three states.</text>
<rect x="70" y="220" width="170" height="66" rx="14" fill="#ffffff" stroke="#1f2430" stroke-width="2"/>
<text x="155" y="250" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2430">IDLE</text>
<circle cx="114" cy="267" r="6" fill="#e4e4ea" stroke="#8a8fa0" stroke-width="1"/>
<text x="126" y="271" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6070">LED dim white</text>
<rect x="440" y="100" width="170" height="66" rx="14" fill="#ffffff" stroke="#1f2430" stroke-width="2"/>
<text x="525" y="130" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2430">CASTING</text>
<circle cx="484" cy="147" r="6" fill="#2f55ff" stroke="#8a8fa0" stroke-width="1"/>
<text x="496" y="151" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6070">LED blue</text>
<rect x="440" y="350" width="170" height="66" rx="14" fill="#ffffff" stroke="#1f2430" stroke-width="2"/>
<text x="525" y="380" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2430">INFLIGHT</text>
<circle cx="484" cy="397" r="6" fill="#ff9600" stroke="#8a8fa0" stroke-width="1"/>
<text x="496" y="401" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6070">LED amber</text>
<path d="M150,218 C150,140 300,120 438,128" fill="none" stroke="#1f2430" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<text x="44" y="104" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">CAST_BUTTON pressed → CAST_START (button)</text>
<text x="44" y="122" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">START_RECORDING → CAST_START (recording)</text>
<polyline points="525,168 525,348" fill="none" stroke="#1f2430" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<text x="538" y="236" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">button cast ends: released</text>
<text x="538" y="254" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">or 3 s limit → CAST_END,</text>
<text x="538" y="272" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">then wait for the Mac</text>
<path d="M438,150 C360,165 300,215 242,240" fill="none" stroke="#1f2430" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<text x="268" y="214" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">recording ends:</text>
<text x="268" y="232" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">STOP_RECORDING, 5 s limit</text>
<text x="268" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">or connection lost → CAST_END</text>
<path d="M438,383 C300,390 190,350 160,290" fill="none" stroke="#1f2430" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<text x="150" y="408" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">GESTURE_RESULT: spell colour for 1 s</text>
<text x="150" y="426" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">(UNKNOWN: 3 flashes), or no answer</text>
<text x="150" y="444" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">within 2 s: 2 magenta flashes</text>
<rect x="730" y="100" width="220" height="300" rx="10" fill="#fafafc" stroke="#d0d3dc" stroke-width="1.5"/>
<text x="746" y="126" font-size="13.5" font-weight="700" text-anchor="start" fill="#1f2430">STATUS_LED</text>
<circle cx="758" cy="154" r="8" fill="#e4e4ea" stroke="#8a8fa0" stroke-width="1"/>
<text x="776" y="158" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">IDLE: dim white</text>
<circle cx="758" cy="188" r="8" fill="#2f55ff" stroke="#8a8fa0" stroke-width="1"/>
<text x="776" y="192" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">CASTING: blue</text>
<circle cx="758" cy="222" r="8" fill="#ff9600" stroke="#8a8fa0" stroke-width="1"/>
<text x="776" y="226" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">INFLIGHT: amber</text>
<circle cx="752" cy="256" r="6" fill="#0050ff" stroke="#ffffff" stroke-width="1"/>
<circle cx="759" cy="256" r="6" fill="#ff4000" stroke="#ffffff" stroke-width="1"/>
<circle cx="766" cy="256" r="6" fill="#00c828" stroke="#ffffff" stroke-width="1"/>
<text x="776" y="260" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">spell colour for 1 s</text>
<circle cx="758" cy="290" r="8" fill="#ff0000" stroke="#8a8fa0" stroke-width="1"/>
<text x="776" y="294" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">UNKNOWN colour ×3 flashes</text>
<circle cx="758" cy="324" r="8" fill="#ff00ff" stroke="#8a8fa0" stroke-width="1"/>
<text x="776" y="328" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">magenta ×2: no answer</text>
<text x="746" y="366" font-size="11" font-weight="400" text-anchor="start" fill="#5b6070">Spell colours come from config.json</text>
<text x="746" y="381" font-size="11" font-weight="400" text-anchor="start" fill="#5b6070">with each GESTURE_RESULT.</text>
</svg>
