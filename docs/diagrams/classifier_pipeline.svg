<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="340" viewBox="0 0 1560 340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>SpellWand classification pipeline</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="arrow-tomac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="arrow-towand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4fd6"/></marker><marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6070"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="42" font-size="22" font-weight="700" text-anchor="start" fill="#1f2430">SpellWand: how a cast is classified</text>
<text x="30" y="64" font-size="13" font-weight="400" text-anchor="start" fill="#5b6070">mac_app/classifier.py. Training examples get the same steps (once, when the dataset changes); every new cast is compared with them.</text>
<rect x="30" y="130.0" width="132" height="72" rx="16" fill="#f4f5f8" stroke="#8a8fa0" stroke-width="1.5"/>
<text x="96" y="160.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2430">GestureSequence</text>
<text x="96" y="178.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2430">t + 6 values/sample</text>
<polyline points="162,166.0 182,166.0" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<rect x="184" y="110" width="152" height="112" rx="8" fill="#e6f5ec" stroke="#2f8f55" stroke-width="1.5"/>
<text x="196" y="134" font-size="13.5" font-weight="700" text-anchor="start" fill="#1f2430">Cut still time</text>
<text x="196" y="156" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">start and end: below</text>
<text x="196" y="174" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">10 % of peak</text>
<text x="196" y="192" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">turning speed</text>
<polyline points="336,166.0 356,166.0" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path d="M434.0,110.0 L510.0,166.0 L434.0,222.0 L358.0,166.0 Z" fill="#e6f5ec" stroke="#2f8f55" stroke-width="1.5" stroke-linejoin="round"/>
<text x="434.0" y="162.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2430">Moved</text>
<text x="434.0" y="178.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2430">enough?</text>
<text x="424.0" y="242" font-size="11" font-weight="400" text-anchor="end" fill="#5b6070">≥ 10 samples and</text>
<text x="424.0" y="257" font-size="11" font-weight="400" text-anchor="end" fill="#5b6070">avg turn ≥ 17 °/s?</text>
<polyline points="434.0,222 434.0,280" fill="none" stroke="#c62828" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-no)"/>
<text x="442.0" y="268" font-size="11.5" font-weight="400" text-anchor="start" fill="#c62828">no</text>
<text x="512" y="158.0" font-size="11" font-weight="400" text-anchor="start" fill="#5b6070">yes</text>
<rect x="382.0" y="282" width="104" height="32" rx="16" fill="#fdecec" stroke="#c62828" stroke-width="1.5"/>
<text x="434.0" y="303" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c62828">UNKNOWN</text>
<polyline points="510,166.0 530,166.0" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<rect x="532" y="110" width="152" height="112" rx="8" fill="#e6f5ec" stroke="#2f8f55" stroke-width="1.5"/>
<text x="544" y="134" font-size="13.5" font-weight="700" text-anchor="start" fill="#1f2430">Remove gravity</text>
<text x="544" y="156" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">follow the gyro to</text>
<text x="544" y="174" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">know which way is</text>
<text x="544" y="192" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">down, subtract it</text>
<polyline points="684,166.0 704,166.0" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<rect x="706" y="110" width="152" height="112" rx="8" fill="#e6f5ec" stroke="#2f8f55" stroke-width="1.5"/>
<text x="718" y="134" font-size="13.5" font-weight="700" text-anchor="start" fill="#1f2430">Resample</text>
<text x="718" y="156" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">40 evenly spaced</text>
<text x="718" y="174" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">points: fast and slow</text>
<text x="718" y="192" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">casts line up</text>
<polyline points="858,166.0 878,166.0" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<rect x="880" y="110" width="152" height="112" rx="8" fill="#e6f5ec" stroke="#2f8f55" stroke-width="1.5"/>
<text x="892" y="134" font-size="13.5" font-weight="700" text-anchor="start" fill="#1f2430">Units and size</text>
<text x="892" y="156" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">g and half-turns/s,</text>
<text x="892" y="174" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">scale to size 1: big</text>
<text x="892" y="192" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">and small match</text>
<polyline points="1032,166.0 1052,166.0" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<rect x="1054" y="110" width="152" height="112" rx="8" fill="#e6f5ec" stroke="#2f8f55" stroke-width="1.5"/>
<text x="1066" y="134" font-size="13.5" font-weight="700" text-anchor="start" fill="#1f2430">Compare (DTW)</text>
<text x="1066" y="156" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">with every stored</text>
<text x="1066" y="174" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">example; average</text>
<text x="1066" y="192" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">distance per point</text>
<polyline points="1206,166.0 1226,166.0" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<rect x="1228" y="110" width="152" height="112" rx="8" fill="#e6f5ec" stroke="#2f8f55" stroke-width="1.5"/>
<text x="1240" y="134" font-size="13.5" font-weight="700" text-anchor="start" fill="#1f2430">Decide</text>
<text x="1240" y="156" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">nearest example within</text>
<text x="1240" y="174" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">the threshold: its</text>
<text x="1240" y="192" font-size="12" font-weight="400" text-anchor="start" fill="#1f2430">label, else UNKNOWN</text>
<polyline points="1380,166.0 1400,166.0" fill="none" stroke="#1f2430" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<rect x="1402" y="130.0" width="140" height="72" rx="16" fill="#f4f5f8" stroke="#8a8fa0" stroke-width="1.5"/>
<text x="1472" y="160.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2430">GestureResult</text>
<text x="1472" y="178.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2430">label, distance</text>
</svg>
